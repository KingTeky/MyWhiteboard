<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Whiteboard - Music Chart Manager</title>
    <link rel="icon" href="bassclef.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script>
        // Defensive inline implementations so buttons respond even if app.js
        // hasn't finished initializing. When the real functions load they
        // will replace these.
        (function(){
            function genCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = '';
                for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
                return code;
            }

            window.createSession = window.createSession || function() {
                console.log('inline createSession called');
                try {
                    if (!window.AppState) window.AppState = {};
                    if (!window.AppState.sessionCode) {
                        window.AppState.sessionCode = genCode();
                        window.AppState.isDirector = true;
                        try { window.AppState.directorToken = 'local'; } catch (e) {}
                    }
                    // Prefer app-level navigation when available
                    if (typeof showPage === 'function') {
                        try { showPage('upload'); } catch (e) {}
                    } else {
                        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                        const up = document.getElementById('upload-page'); if (up) up.classList.add('active');
                    }
                    const uploadCodeEl = document.getElementById('session-code-display'); if (uploadCodeEl) uploadCodeEl.textContent = window.AppState.sessionCode;
                    const viewerCodeTextEl = document.getElementById('viewer-session-code-text'); if (viewerCodeTextEl) viewerCodeTextEl.textContent = `Session: ${window.AppState.sessionCode}`;
                    try { if (typeof updateRoleUI === 'function') updateRoleUI(); } catch (e) {}
                } catch (e) { console.warn('inline createSession failed', e); }
            };

            window.joinSession = window.joinSession || function() {
                try {
                    const input = document.getElementById('session-code-input');
                    if (!input) { alert('No session input found'); return; }
                    const code = (input.value || '').trim().toUpperCase();
                    if (code.length !== 6) { alert('Please enter a valid 6-character session code'); return; }
                    if (!window.AppState) window.AppState = {};
                    window.AppState.sessionCode = code;
                    window.AppState.isDirector = !!(window.AppState && window.AppState.directorToken) || !!localStorage.getItem(`session_${code}_directorToken`);
                    if (typeof showPage === 'function') {
                        try { showPage('viewer'); } catch (e) {}
                        try { if (typeof switchToMode === 'function') switchToMode('live'); } catch (e) {}
                    } else {
                        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                        const vp = document.getElementById('viewer-page'); if (vp) vp.classList.add('active');
                    }
                    const viewerCodeTextEl = document.getElementById('viewer-session-code-text'); if (viewerCodeTextEl) viewerCodeTextEl.textContent = `Session: ${code}`;
                } catch (e) { console.warn('inline joinSession failed', e); }
            };
        })();
    </script>
</head>
<body>
    <div id="app">
        <!-- Landing Page -->
        <div id="landing-page" class="page active">
            <div class="container">
                <header>
                    <h1 class="brand"><img src="bassclef.svg" class="brand-icon" alt="Bass clef" width="36" height="36">MusicWhiteboard</h1>
                    <p class="tagline">Modern Music Chart Management for Musicians</p>
                    <div class="header-controls">
                        <button class="btn btn-icon theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                            <!-- Icon will be set by JS -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"></circle>
                            </svg>
                        </button>
                    </div>
                </header>
                
                <div class="action-cards">
                    <div class="card">
                        <h2>Music Director</h2>
                        <p>Create a new session and upload music charts</p>
                        <button id="create-session-btn" class="btn btn-primary" onclick="createSession()">Create Session</button>
                    </div>
                    
                    <div class="card">
                        <h2>Musician</h2>
                        <p>Join an existing session with a code</p>
                        <div class="input-group">
                            <input type="text" id="session-code-input" placeholder="Enter session code" maxlength="6">
                            <button id="join-session-btn" class="btn btn-secondary" onclick="joinSession()">Join Session</button>
                        </div>
                    </div>
                </div>

                <!-- Sidebar: thumbnails (per-page) -->
                <aside id="sidebar" class="sidebar" aria-label="Page thumbnails">
                    <div id="sidebar-thumbs" class="sidebar-thumbs"></div>
                </aside>
            </div>
        </div>

        <!-- MD Upload Page -->
        <div id="upload-page" class="page">
            <div class="container">
                <header class="page-header">
                    <h1>Upload Music Charts</h1>
                    <div class="session-info">
                        <span>Session Code: <strong id="session-code-display"></strong></span>
                        <button id="start-session-btn" class="btn btn-primary">Start Session</button>
                    </div>
                    <div class="header-controls">
                        <button class="btn btn-icon theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"></circle>
                            </svg>
                        </button>
                    </div>
                </header>
                
                <div class="upload-area">
                    <input type="file" id="pdf-upload" accept=".pdf" multiple hidden>
                    <div id="drop-zone" class="drop-zone">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Drag and drop PDF files here</p>
                        <p class="or-text">or</p>
                        <button id="browse-files-btn" class="btn btn-secondary">Browse Files</button>
                    </div>
                </div>
                
                <div id="uploaded-files" class="uploaded-files"></div>
            </div>
        </div>

        <!-- Pages Editor Modal: edit individual pages within a chart (remove pages) -->
        <div id="pages-editor-modal" class="modal" aria-hidden="true">
            <div class="modal-backdrop" id="pages-editor-backdrop"></div>
            <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="pages-editor-title">
                <header class="modal-header">
                    <h3 id="pages-editor-title">Edit Chart Pages</h3>
                    <button id="pages-editor-close" class="btn btn-icon" aria-label="Close">✖</button>
                </header>
                <div id="pages-editor-body" class="modal-body">
                    <div id="pages-editor-grid" class="pages-grid"></div>
                </div>
                <footer class="modal-footer">
                    <button id="pages-editor-done" class="btn btn-primary">Done</button>
                </footer>
            </div>
        </div>

        <!-- Viewer Page -->
        <div id="viewer-page" class="page">
            <div class="viewer-container">
                <div class="viewer-header">
                    <div class="viewer-title">
                        <h2 id="current-chart-name">Chart Name</h2>
                        <span id="page-indicator">Page 1 of 1</span>
                    </div>
                    <div class="viewer-controls">
                        <!-- Add charts button placed left of organize button; icon-only to match other controls -->
                        <button id="add-charts-btn" class="btn btn-icon" title="Add Charts" aria-label="Add Charts">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <button id="organize-mode-btn" class="btn btn-icon" title="Organize Mode">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                        <!-- Live mode: attendee-facing view -->
                        <button id="live-mode-btn" class="btn btn-icon" title="Live Mode">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 3v18l15-9z"></path>
                            </svg>
                        </button>
                        
                        <button id="annotation-btn" class="btn btn-icon" title="Toggle Annotations">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 19l7 2-2-7-7-7-5 5z"></path>
                                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                            </svg>
                        </button>
                        <!-- Annotation toolbar (per-page tools) -->
                        <div id="annotation-toolbar" class="annotation-toolbar" hidden>
                            <input type="color" id="annotation-color" title="Annotation color" value="#ef4444">
                            <button id="annotation-undo" class="btn btn-icon" title="Undo last stroke" aria-label="Undo">⟲</button>
                            <button id="annotation-clear" class="btn btn-icon" title="Clear page annotations" aria-label="Clear">✖</button>
                        </div>
                        <button id="leave-session-btn" class="btn btn-secondary">Leave</button>
                        <!-- session code and copy button placed to the left of the theme toggle -->
                        <div class="viewer-session-code" id="viewer-session-code" aria-live="polite">
                            <span id="viewer-session-code-text" class="code-text"></span>
                            <button id="copy-session-code-btn" class="btn btn-icon" title="Copy session code" aria-label="Copy session code">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                        <!-- theme toggle is the rightmost control -->
                        <button class="btn btn-icon theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"></circle>
                            </svg>
                        </button>
                    </div>
                    
                </div>

                <!-- Edit Mode View (previously Concert Mode) -->
                <div id="edit-view" class="view active">
                    <div class="pdf-viewer-container">
                        <div class="pdf-display">
                    <canvas id="pdf-canvas"></canvas>
                    <iframe id="pdf-viewer" style="display:none"></iframe>
                    <canvas id="annotation-canvas"></canvas>
                        </div>
                    </div>
                    <div class="navigation-controls">
                        <button id="prev-page-btn" class="btn btn-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <button id="prev-chart-btn" class="btn btn-secondary">Previous Chart</button>
                        <button id="next-chart-btn" class="btn btn-secondary">Next Chart</button>
                        <button id="next-page-btn" class="btn btn-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Live Mode View: attendee-facing continuous scroll with thumbnails -->
                <div id="live-view" class="view">
                    <div class="live-container">
                            <div class="live-pages-wrapper">
                                <div id="live-pages" class="live-pages"></div>
                            </div>

                            <div id="live-splitter" class="live-splitter" aria-hidden="true"></div>

                            <aside class="live-right live-module-dock" aria-label="Module dock right">
                                <div id="live-chat-module" class="live-module">
                                    <div class="module-header">Chat</div>
                                    <div class="module-content"></div>
                                </div>
                                <div id="live-thumbs-module" class="live-module thumbs-module">
                                    <div class="module-header">Thumbnails</div>
                                    <div class="module-content live-thumbs"></div>
                                </div>
                            </aside>
                        </div>
                </div>

                <!-- Organize Mode View -->
                <div id="organize-view" class="view">
                    <div class="organize-controls"></div>
                    <div id="charts-grid" class="charts-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PDF.js for thumbnail generation and SortableJS for touch-friendly drag/reorder -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="pageManager.js"></script>
    <script src="app.js"></script>
</body>
</html>
